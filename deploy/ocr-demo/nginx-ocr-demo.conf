# Shared nginx VM (107, nginxgeneral) → /etc/nginx/sites-available/ocr-demo.conf
# To change the domain later, edit server_name only.
server {
    listen 80;
    server_name saigondepot.<PUBLIC_IP>.sslip.io;

    # YouTube jobs take a link, not an upload, but keep room for small posts.
    client_max_body_size 10m;

    location / {
        proxy_pass http://<APP_HOST_IP>:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/jobs/<id>/live is an MJPEG stream (multipart/x-mixed-replace):
        # buffering would hold frames back, and a clip can run up to 10 minutes.
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
