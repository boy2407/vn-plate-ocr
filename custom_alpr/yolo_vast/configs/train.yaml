# Identical geometry/schedule for control and moderate. Noise is injected by trainer.py.
epochs: 30
imgsz: 640
batch: 16
workers: 4
seed: 42
deterministic: true
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 2.0
cos_lr: true
patience: 30
mosaic: 0.4
close_mosaic: 10
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
degrees: 5.0
translate: 0.05
scale: 0.15
shear: 1.0
perspective: 0.0001
hsv_h: 0.01
hsv_s: 0.3
hsv_v: 0.25
fliplr: 0.5
flipud: 0.0
cache: false
amp: true
save: true
save_period: 1
plots: true
val: true
