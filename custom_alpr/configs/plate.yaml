# Custom Vietnamese plate recognizer; no pretrained OCR weights are loaded.
max_plate_slots: 10
alphabet: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_"
pad_char: "_"
img_height: 64
img_width: 128
keep_aspect_ratio: false
interpolation: linear
image_color_mode: rgb
padding_color: [114, 114, 114]
plate_regions: null
